name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - claude/wizardly-hypatia-ik9ybe
    paths:
      - app.py
      - nbp.py
      - icon.ico
      - requirements.txt
      - PrzelicznikWalut.html
      - .github/workflows/build-windows-exe.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Budowanie pliku .exe
        run: pyinstaller --noconfirm --onefile --windowed --name PrzelicznikWalut --icon icon.ico --add-data "icon.ico;." app.py

      - name: Publikacja artefaktu (do pobrania z zakladki Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PrzelicznikWalut-windows
          path: dist/PrzelicznikWalut.exe

      - name: Publikacja w Releases (staly link do pobrania)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build
          name: Przelicznik Walut - wersja Windows
          body: |
            Dwie wersje do pobrania:

            * **PrzelicznikWalut.html** - wersja przegladarkowa (ZALECANA na komputery firmowe).
              Otwierasz dwuklikiem w Edge/Chrome. Nie wymaga instalacji ani uprawnien admina
              i NIE jest blokowana przez antywirus.
            * **PrzelicznikWalut.exe** - wersja desktopowa dla Windows. Uwaga: antywirus moze
              ja blednie oznaczyc (false positive PyInstallera).
          files: |
            dist/PrzelicznikWalut.exe
            PrzelicznikWalut.html
